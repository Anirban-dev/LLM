version: '3.8'

# Utility Infrastructure for Local Development & Production
# Run utility containers with: docker compose -f docker-compose.dev.yml up -d
# Launch application locally with: npm run dev

services:
  # 1. MongoDB Database Utility Service
  mongodb:
    image: mongo:7.0
    container_name: chatapp-mongodb-dev
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. SeaweedFS Self-Hosted Distributed S3-Compatible Object Storage
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: chatapp-seaweedfs-dev
    restart: always
    command: "server -s3 -s3.port=8333 -dir=/data -s3.allowEmptyFolder=true"
    ports:
      - "8333:8333"   # SeaweedFS S3 API Endpoint
      - "9333:9333"   # SeaweedFS Master HTTP UI
      - "8888:8888"   # SeaweedFS Filer HTTP Endpoint
    volumes:
      - seaweedfs_dev_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_dev_data:
  seaweedfs_dev_data:
