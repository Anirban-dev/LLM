version: '3.8'

# Utility Infrastructure for Local Development
# Run utility containers with: docker compose -f docker-compose.dev.yml up -d
# Launch application locally with: npm run dev

services:
  # 1. MongoDB Database Utility Service
  mongodb:
    image: mongo:7.0
    container_name: chatapp-mongodb-dev
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. MinIO Self-Hosted S3-Compatible Object Storage
  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-31Z
    container_name: chatapp-minio-dev
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API Endpoint
      - "9001:9001"   # MinIO Web Console UI
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. MinIO Auto-Bucket & Policy Initializer
  minio-init:
    image: minio/mc:RELEASE.2024-01-28T16-23-42Z
    container_name: chatapp-minio-init-dev
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for MinIO server to start...';
        until /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin; do sleep 2; done;
        echo 'Creating chatapp-media bucket...';
        /usr/bin/mc mb myminio/chatapp-media --ignore-existing;
        echo 'Setting public download policy for chatapp-media bucket...';
        /usr/bin/mc anonymous set download myminio/chatapp-media;
        echo 'MinIO Object Storage initialized successfully!';
      "

volumes:
  mongo_dev_data:
  minio_dev_data:
