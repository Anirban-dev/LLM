version: '3.8'

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: chatapp-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Ollama Local CPU Model Runner (Llama 3.2 3B & Whisper)
  ollama:
    image: ollama/ollama:latest
    container_name: chatapp-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # 3. Automatic Ollama Model Pre-Loader
  ollama-model-puller:
    image: curlimages/curl:latest
    container_name: chatapp-ollama-puller
    depends_on:
      - ollama
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for Ollama to be ready...';
        while ! curl -s http://ollama:11434/api/tags > /dev/null; do sleep 2; done;
        echo 'Pulling llama3.2:3b for CPU Persona Extraction & Clone Chat...';
        curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"llama3.2:3b\"}';
        echo 'Pulling whisper model for local speech-to-text...';
        curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"whisper\"}';
        echo 'Ollama models pulled successfully!';
      "

  # 4. ChatApp Full-Stack Node Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatapp-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/chatapp-db
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - JWT_SECRET=chatapp_secret_jwt_key_2026
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - app_uploads:/app/uploads

volumes:
  mongo_data:
  ollama_data:
  app_uploads:
